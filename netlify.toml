# Netlify build settings, and the single-page-app fallback: any URL that isn't a real file serves index.html, so refreshing /product/42 works
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
